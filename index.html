    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShogiLab: a 四間飛車 (Shiken-bisha) trainer with sourced joseki, study and quiz, spaced review, tsume, an AI coach and game analysis." />
    <meta name="theme-color" content="#16202e" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ShogiLab 将棋ラボ</title>
    <script>
      if (window.isSecureContext && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('coi-sw.js').then(() => {
          if (!window.crossOriginIsolated && !navigator.serviceWorker.controller && !sessionStorage.getItem('coi-reloaded')) {
            sessionStorage.setItem('coi-reloaded', '1')
            location.reload()
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
