name: Deploy to GitHub Pages

# One Pages site: production from main at /, every open same-repo PR at /pr/<n>/.
# Each run reassembles the whole site from caches: only changed PRs rebuild, closed PRs disappear, nothing is stored in git.
# pull_request_target runs this file from main, so previews start working once it is merged.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs never build: pull_request_target has write access.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      # Production only rebuilds when main moved; PR events reuse it.
      - id: prod
        uses: actions/cache@v4
        with:
          path: build/client
          key: site-${{ github.sha }}
      - if: steps.prod.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile
          node scripts/validate.mjs
          bun run lint
          bun run format:check
          bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: ./.github/actions/pr-previews
        with:
          # Hidden URLs (set the PREVIEW_SECRET repository secret); the link is only commented on private repos.
          secret: ${{ secrets.PREVIEW_SECRET }}
          # The 95 MB offline full book is download-on-demand; previews skip it.
          exclude: books/peta233-full-v1
          comment-pr: ${{ github.event.repository.private && github.event.pull_request.number || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
