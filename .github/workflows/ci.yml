name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/validate.mjs
      - run: bun run check
      - run: bun run build
      - name: React Doctor (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npx -y react-doctor@latest --no-telemetry --scope changed --base origin/${{ github.base_ref }}
